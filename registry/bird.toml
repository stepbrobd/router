representation = "symbol"
label = "name"

[[bindings]]
id = "symbol.known"
rules = ["symbol_known"]
file = "conf/confbase.Y"
storage = "s"
representation = "symbol"
label = "name"

[[bindings]]
id = "ip.scope"
rules = ["ipa_scope"]
