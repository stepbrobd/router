version = 1
header_field = "from"
channel_kinds = [
  "channel.kind",
  "channel.neighbor-start",
  "channel.bgp-kind",
  "channel.mpls-start",
]

[declaration_order]
first = ["define", "attribute"]
last = ["function", "filter", "template", "protocol"]

[roles]
args = "args"
return = "return"
variables = "variables"
body = "body"

[storage]
s = "symbol"
r = "symbol"
fl = "body"
i = "semantic"
i32 = "semantic"
i64 = "semantic"
a = "semantic"
ip4 = "semantic"
ip6 = "semantic"
mac = "semantic"
net = "semantic"
net_ptr = "semantic"
rd = "semantic"
rt = "semantic"
esi = "semantic"
t = "text"
bs = "semantic"
v = "semantic"
time = "semantic"
settle = "semantic"
cl = "semantic"
tf = "semantic"
tfp = "semantic"
f = "semantic"
e = "semantic"
trie = "semantic"
const_trie = "semantic"
ad = "semantic"
iface = "semantic"
x = "program"
xp = "program"
fa = "program"
fret = "semantic"
ecs = "semantic"
ea_class = "semantic"
fsa = "semantic"
fab = "semantic"
flv = "semantic"
px = "semantic"
ai = "semantic"

[lexical]
i = "integer"
i32 = "integer"
i64 = "integer"
ip4 = "ip-address"
ip6 = "ip-address"
s = "symbol"
t = "string"
mac = "expression"
rd = "expression"
bs = "expression"

[families]
ip4 = "ipv4"
ip6 = "ipv6"

[c_types]
i = ["uint"]
i32 = ["u32"]
i64 = ["u64"]
time = ["btime"]
t = ["const char *"]
a = ["ip_addr"]
ip4 = ["ip4_addr"]
ip6 = ["ip6_addr"]
net = ["net_addr"]
net_ptr = ["net_addr *"]
s = ["struct symbol *"]
r = ["struct rtable_config *"]
cc = ["struct channel_config *"]
iface = ["struct iface *"]
x = ["struct f_inst *"]
fl = ["struct f_line *"]
fa = ["struct f_arg *"]
f = ["const struct filter *"]
ecs = ["enum ec_subtype"]
cl = ["struct channel_limit"]
v = ["struct f_val"]
e = ["struct f_tree *"]

[[namespaces]]
prefix = ["protocol"]

[[namespaces]]
prefix = ["template"]

[[namespaces]]
suffix = ["table"]

[[bindings]]
id = "number.expression"
rules = ["expr"]
file = "conf/confbase.Y"
storage = "i"
representation = "number-expression"
label = "value"
references = ["NUM", "conf_expr"]

[[bindings]]
id = "number.duration"
rules = ["expr_us"]
file = "conf/confbase.Y"
storage = "time"
representation = "duration"
label = "value"
references = ["expr", "S", "MS", "US"]

[[bindings]]
id = "switch"
rules = ["bool"]
file = "conf/confbase.Y"
storage = "i"
representation = "switch"
label = "enabled"
references = ["ON", "OFF", "NUM", "conf_expr"]
values = { true = ["on"], false = ["off"] }

[[bindings]]
id = "string"
rules = ["text"]
file = "conf/confbase.Y"
storage = "t"
representation = "string"
label = "text"

[[bindings]]
id = "ip-address"
rules = ["ipa"]
file = "conf/confbase.Y"
storage = "a"
representation = "ip-address"
label = "address"

[[bindings]]
id = "prefix"
