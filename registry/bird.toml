fields = { "string" = "pattern", "TEXT" = "pattern", "IP4" = "address", "IP6" = "address" }

[[bindings]]
id = "interface.pattern-data"
rules = ["iface_patt_node_body"]
file = "nest/config.Y"
shape = "record"
