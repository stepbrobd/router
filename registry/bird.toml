storage = "net_ptr"
label = "prefix"

[[bindings]]
id = "prefix.ip"
rules = ["net_ip"]
file = "conf/confbase.Y"
storage = "net"
representation = "prefix"
label = "prefix"

[[bindings]]
id = "prefix.internal"
rules = ["net_ip_"]
file = "conf/confbase.Y"
