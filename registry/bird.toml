fields = { "string" = "pattern", "TEXT" = "pattern", "IP4" = "address", "IP6" = "address", "prefix-or-address" = "prefix" }

[[bindings]]
id = "interface.exclude"
rules = ["iface_negate"]
file = "nest/config.Y"
shape = "flag"
label = "exclude"

[[bindings]]
id = "static.options"
rules = ["static_proto"]
file = "proto/static/config.Y"

[[bindings]]
id = "static.route-body"
rules = ["stat_route_opt_list"]
file = "proto/static/config.Y"
shape = "body"
atomic = true
label = "body"

[[bindings]]
id = "constant.reference-expression"
rules = ["conf_expr"]
file = "conf/confbase.Y"
storage = "v"
representation = "expression"
references = ["symbol_known", "term"]

[[bindings]]
id = "address-or-string"
rules = ["text_or_ipa"]
file = "conf/confbase.Y"
storage = "v"
shape = "record"
